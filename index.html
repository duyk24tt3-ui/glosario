<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useMemo, useRef } = React;

const POS = ['Danh từ', 'Động từ', 'Tính từ', 'Trạng từ', 'Cụm từ'];
const TOPICS = ['Luật', 'Kinh tế', 'Y tế', 'Ngoại giao', 'Du lịch', 'Văn hóa', 'Kỹ thuật', 'Chung'];
const KEY = 'glosario_es_vi_v1';
const emptyForm = { es: '', vi: '', pos: 'Danh từ', topic: 'Chung', family: [], exEs: '', exVi: '', note: '' };

const load = (k, d) => { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } };
const save = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };
const norm = s => (s || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/đ/g, 'd');
const speak = t => { try { const u = new SpeechSynthesisUtterance(t); u.lang = 'es-ES'; speechSynthesis.cancel(); speechSynthesis.speak(u); } catch (e) {} };
const download = (name, text, type) => {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], { type }));
  a.download = name; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
};

// Gộp danh sách từ bên ngoài vào danh sách hiện có (so khớp theo từ tiếng Tây Ban Nha, không phân biệt dấu/hoa thường)
const mergeWords = (current, incoming, overwrite, tombs = {}) => {
  const idx = new Map(current.map((w, i) => [norm(w.es), i]));
  const list = [...current];
  let added = 0, updated = 0, skipped = 0;
  incoming.forEach(w => {
    if (!w || !w.es || !w.vi) { skipped++; return; }
    const clean = { ...emptyForm, ...w, family: Array.isArray(w.family) ? w.family : [] };
    const k = norm(w.es);
    if (idx.has(k)) {
      if (overwrite) { list[idx.get(k)] = { ...clean, id: list[idx.get(k)].id, updated: Date.now() }; updated++; } else skipped++;
    } else {
      if (tombs[k]) { skipped++; return; }
      idx.set(k, list.length);
      list.push({ ...clean, id: crypto.randomUUID(), created: Date.now(), updated: w.updated || Date.now() }); added++;
    }
  });
  return { list, added, updated, skipped };
};

// ===== Đồng bộ hai chiều: gộp theo từ khóa (không phân biệt dấu), có "bia mộ" cho từ đã xóa =====
const keyOf = w => norm(w.es);
const mergeState = (local, remote) => {
  const lm = new Map(local.words.map(w => [keyOf(w), w]));
  const rm = new Map((remote.words || []).filter(w => w && w.es && w.vi).map(w => [keyOf(w), w]));
  const tomb = {};
  [local.deleted, remote.deleted].forEach(d => Object.entries(d || {}).forEach(([k, t]) => { tomb[k] = Math.max(tomb[k] || 0, t); }));
  const words = [], deleted = {};
  new Set([...lm.keys(), ...rm.keys(), ...Object.keys(tomb)]).forEach(k => {
    const l = lm.get(k), r = rm.get(k);
    let w = null;
    if (l && r) w = (r.updated || 0) > (l.updated || 0) ? { ...emptyForm, ...r, family: Array.isArray(r.family) ? r.family : [], id: l.id } : l;
    else if (l) w = l;
    else if (r) w = { ...emptyForm, ...r, family: Array.isArray(r.family) ? r.family : [], id: r.id || crypto.randomUUID() };
    if (tomb[k] && (!w || tomb[k] >= (w.updated || 0))) deleted[k] = tomb[k];
    else if (w) words.push(w);
  });
  return { words, deleted };
};
const canon = st => JSON.stringify({
  w: st.words.map(w => [keyOf(w), w.es, w.vi, w.pos || '', w.topic || '', w.family || [], w.exEs || '', w.exVi || '', w.note || '', w.updated || 0]).sort((a, b) => (a[0] < b[0] ? -1 : a[0] > b[0] ? 1 : 0)),
  d: Object.entries(st.deleted || {}).sort()
});
const GIST_FILE = 'glosario-sync.json';
const gh = (path, opts, token) => fetch('https://api.github.com' + path, { ...opts,
  headers: { Accept: 'application/vnd.github+json', Authorization: 'Bearer ' + token, ...(opts && opts.body ? { 'Content-Type': 'application/json' } : {}) } });
const b64enc = bytes => { let t = ''; bytes.forEach(b => { t += String.fromCharCode(b); }); return btoa(t).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''); };
const b64dec = str => { let t = str.replace(/-/g, '+').replace(/_/g, '/'); while (t.length % 4) t += '='; return Uint8Array.from(atob(t), c => c.charCodeAt(0)); };
const streamBytes = async (bytes, Ctor) => { const st = new Ctor('gzip'); const w = st.writable.getWriter(); w.write(bytes); w.close(); return new Uint8Array(await new Response(st.readable).arrayBuffer()); };
const encodeCode = async data => {
  const bytes = new TextEncoder().encode(JSON.stringify(data));
  return typeof CompressionStream !== 'undefined' ? 'GLO1:' + b64enc(await streamBytes(bytes, CompressionStream)) : 'GLO0:' + b64enc(bytes);
};
const decodeCode = async code => {
  const c = code.trim(), i = c.indexOf(':');
  const tag = c.slice(0, i), body = c.slice(i + 1).replace(/\s+/g, '');
  if (tag !== 'GLO1' && tag !== 'GLO0') throw new Error('Mã không bắt đầu bằng GLO1: hoặc GLO0:.');
  let bytes = b64dec(body);
  if (tag === 'GLO1') {
    if (typeof DecompressionStream === 'undefined') throw new Error('Trình duyệt này không giải nén được mã GLO1.');
    bytes = await streamBytes(bytes, DecompressionStream);
  }
  return JSON.parse(new TextDecoder().decode(bytes));
};

const inputCls = 'w-full rounded-lg border border-slate-300 dark:border-slate-600 bg-white dark:bg-[#18223A] px-3 py-2 text-sm';
const btn = 'rounded-lg px-4 py-2 text-sm font-semibold transition';
const btnMain = btn + ' bg-[#E9B000] text-[#14213D] hover:bg-[#f5c21b]';
const btnSoft = btn + ' bg-slate-200 dark:bg-[#222E4C] hover:bg-slate-300 dark:hover:bg-[#2c3a5e]';

function Field({ label, children }) {
  return <label className="block"><span className="text-xs font-semibold text-slate-500 dark:text-slate-400">{label}</span>{children}</label>;
}

const lookupCache = {};
function Detail({ w, onClose, onEdit, emph }) {
  const [term, setTerm] = useState(w.es);
  const [box, setBox] = useState(w.es);
  const [st, setSt] = useState({ loading: true, text: '', err: '' });
  useEffect(() => {
    const h = e => e.key === 'Escape' && onClose();
    window.addEventListener('keydown', h);
    return () => window.removeEventListener('keydown', h);
  }, []);
  useEffect(() => {
    let dead = false;
    if (lookupCache[term]) { setSt(lookupCache[term]); return; }
    setSt({ loading: true, text: '', err: '' });
    fetch(`https://es.wiktionary.org/w/api.php?action=query&prop=extracts&explaintext=1&redirects=1&format=json&origin=*&titles=${encodeURIComponent(term)}`)
      .then(r => r.json()).then(j => {
        const pg = Object.values((j.query && j.query.pages) || {})[0];
        let t = pg && pg.extract;
        if (!t) throw new Error('Wiktionary tiếng Tây Ban Nha chưa có mục “' + term + '”. Thử các nút tra cứu bên dưới.');
        const m = t.match(/(?:^|\n)==\s*Español\s*==\s*\n([\s\S]*?)(?=\n==\s*[^=]|$)/);
        if (m) t = m[1];
        t = t.replace(/^=+\s*(.*?)\s*=+$/gm, '▸ $1').replace(/\n{3,}/g, '\n\n').trim();
        if (t.length > 1800) t = t.slice(0, 1800) + '…';
        const v = { loading: false, text: t, err: '' };
        lookupCache[term] = v;
        if (!dead) setSt(v);
      }).catch(e => { if (!dead) setSt({ loading: false, text: '', err: e.message || 'Không tải được (kiểm tra kết nối mạng).' }); });
    return () => { dead = true; };
  }, [term]);
  const go = t => { const v = t.trim(); if (v) { setTerm(v); setBox(v); } };
  const e = encodeURIComponent(term);
  const links = [
    ['RAE (DLE)', `https://dle.rae.es/${e}`],
    ['WordReference – định nghĩa', `https://www.wordreference.com/definicion/${e}`],
    ['DeepL ES→VI', `https://www.deepl.com/translator#es/vi/${e}`],
    ['WordReference ES–EN', `https://www.wordreference.com/es/en/translation.asp?spen=${e}`],
    ['Google Dịch ES→VI', `https://translate.google.com/?sl=es&tl=vi&op=translate&text=${e}`],
    ['Wiktionary', `https://es.wiktionary.org/wiki/${e}`],
  ];
  const big = emph === 'vi' ? w.vi : w.es, small = emph === 'vi' ? w.es : w.vi;
  const forms = [w.es, ...w.family.filter(f => f !== w.es)];
  return (
    <div className="fixed inset-0 z-50 bg-black/60 flex items-end sm:items-center justify-center sm:p-4" onClick={onClose}>
      <div className="bg-white dark:bg-[#18223A] w-full sm:max-w-xl max-h-[92vh] overflow-y-auto rounded-t-2xl sm:rounded-2xl p-5 space-y-4" role="dialog" aria-modal="true" onClick={ev => ev.stopPropagation()}>
        <div className="flex items-start justify-between gap-3">
          <div>
            <h2 className="text-3xl font-extrabold text-[#14213D] dark:text-[#E9B000] leading-tight">{big}</h2>
            <p className="text-lg text-slate-600 dark:text-slate-300 mt-1">{small}</p>
          </div>
          <div className="flex gap-1 shrink-0">
            <button className={btnSoft + ' !px-3'} onClick={() => speak(w.es)} aria-label="Nghe phát âm">🔊</button>
            <button className={btnSoft + ' !px-3'} onClick={onClose} aria-label="Đóng">✕</button>
          </div>
        </div>
        <div className="flex flex-wrap gap-2 text-xs">
          <span className="px-2 py-1 rounded-full bg-slate-200 dark:bg-[#222E4C]">Từ loại: {w.pos}</span>
          <span className="px-2 py-1 rounded-full border border-[#E9B000]">Chủ đề: {w.topic}</span>
        </div>
        {(w.exEs || w.exVi) && <div className="text-sm border-l-4 border-[#E9B000] pl-3"><p className="italic">{w.exEs}</p><p className="text-slate-500 dark:text-slate-400">{w.exVi}</p>
          <p className="mt-2 flex flex-wrap gap-x-4 gap-y-1 text-xs">
            {w.exEs && <a className="underline" href={`https://www.deepl.com/translator#es/vi/${encodeURIComponent(w.exEs)}`} target="_blank" rel="noopener noreferrer">Đối chiếu ES→VI bằng DeepL ↗</a>}
            {w.exVi && <a className="underline" href={`https://www.deepl.com/translator#vi/es/${encodeURIComponent(w.exVi)}`} target="_blank" rel="noopener noreferrer">Đối chiếu VI→ES bằng DeepL ↗</a>}
          </p></div>}
        {w.note && <p className="text-sm text-slate-600 dark:text-slate-300">📌 {w.note}</p>}
        <div>
          <p className="text-xs font-semibold text-slate-500 dark:text-slate-400 mb-1">Tra nhanh từ gốc và các dạng từ (bấm để xem định nghĩa)</p>
          <div className="flex flex-wrap gap-2">
            {forms.map(f => <button key={f} onClick={() => go(f)} aria-pressed={term === f}
              className={'text-sm px-3 py-1 rounded-full border ' + (term === f ? 'bg-[#E9B000] text-[#14213D] border-[#E9B000] font-semibold' : 'border-slate-300 dark:border-slate-600')}>{f}</button>)}
          </div>
          <div className="flex gap-2 mt-2">
            <input className={inputCls} value={box} onChange={ev => setBox(ev.target.value)} onKeyDown={ev => ev.key === 'Enter' && go(box)} placeholder="Tra từ khác…" />
            <button className={btnSoft} onClick={() => go(box)}>Tra</button>
          </div>
        </div>
        <div className="rounded-lg bg-slate-100 dark:bg-[#0F1626] p-3 text-sm">
          <p className="text-xs font-semibold text-slate-500 dark:text-slate-400 mb-2">Định nghĩa “{term}” — Wiktionary (tiếng Tây Ban Nha)</p>
          {st.loading ? <p className="text-slate-500">Đang tra…</p> : st.err ? <p className="text-slate-500">{st.err}</p> :
            <pre className="whitespace-pre-wrap font-sans max-h-64 overflow-y-auto">{st.text}</pre>}
        </div>
        <div>
          <p className="text-xs font-semibold text-slate-500 dark:text-slate-400 mb-1">Mở từ điển khác cho “{term}”</p>
          <div className="flex flex-wrap gap-2">
            {links.map(([l, u]) => <a key={l} href={u} target="_blank" rel="noopener noreferrer" className={btnSoft + ' !py-1 !px-3 inline-block'}>{l} ↗</a>)}
          </div>
        </div>
        <div className="flex gap-2"><button className={btnMain} onClick={() => onEdit(w)}>Sửa thuật ngữ</button><button className={btnSoft} onClick={onClose}>Đóng</button></div>
      </div>
    </div>
  );
}

function Library({ words, onEdit, onDelete, topics, q, setQ, topic, setTopic, emph, setEmph }) {
  const [open, setOpen] = useState(null);
  const list = useMemo(() => {
    const n = norm(q);
    return words.filter(w => (!topic || w.topic === topic) &&
      (!n || norm(w.es).includes(n) || norm(w.vi).includes(n) || w.family.some(f => norm(f).includes(n))));
  }, [words, q, topic]);
  const openWord = open ? words.find(w => w.id === open) : null;
  const stop = fn => ev => { ev.stopPropagation(); fn(); };
  return (
    <div>
      <div className="flex flex-col sm:flex-row gap-2 mb-3">
        <input className={inputCls} placeholder="Tìm nhanh ES hoặc VI (không cần dấu)…" value={q} onChange={e => setQ(e.target.value)} />
        <select className={inputCls + ' sm:w-48'} value={topic} onChange={e => setTopic(e.target.value)}>
          <option value="">Mọi chủ đề</option>
          {topics.map(t => <option key={t}>{t}</option>)}
        </select>
      </div>
      <div className="flex flex-wrap items-center justify-between gap-2 mb-3">
        <p className="text-xs text-slate-500">{list.length} / {words.length} thuật ngữ · Bấm vào thẻ để xem chi tiết</p>
        <div className="inline-flex rounded-lg overflow-hidden border border-slate-300 dark:border-slate-600 text-xs font-semibold" role="group" aria-label="Chọn ngôn ngữ nổi bật">
          {[['vi', 'Nổi bật: Tiếng Việt'], ['es', 'Nổi bật: Tây Ban Nha']].map(([k, l]) =>
            <button key={k} onClick={() => setEmph(k)} aria-pressed={emph === k}
              className={'px-3 py-1.5 ' + (emph === k ? 'bg-[#E9B000] text-[#14213D]' : 'bg-white dark:bg-[#18223A]')}>{l}</button>)}
        </div>
      </div>
      {list.length === 0 && <p className="py-12 text-center text-slate-500">Chưa có thuật ngữ nào khớp. Sang tab “Thêm từ” để tạo mục đầu tiên hoặc nhập file JSON.</p>}
      <div className="grid gap-3 md:grid-cols-2">
        {list.map(w => {
          const big = emph === 'vi' ? w.vi : w.es, small = emph === 'vi' ? w.es : w.vi;
          return (
            <article key={w.id} role="button" tabIndex="0" onClick={() => setOpen(w.id)}
              onKeyDown={e => (e.key === 'Enter' || e.key === ' ') && (e.preventDefault(), setOpen(w.id))}
              className="cursor-pointer rounded-xl bg-white dark:bg-[#18223A] border border-slate-200 dark:border-slate-700 hover:border-[#E9B000] p-4">
              <div className="flex items-start justify-between gap-2">
                <div>
                  <h3 className="text-2xl font-extrabold text-[#14213D] dark:text-[#E9B000] leading-tight">{big}</h3>
                  <p className="text-sm mt-1 text-slate-600 dark:text-slate-300">{small}</p>
                </div>
                <div className="flex flex-col items-end gap-1 text-xs">
                  <span className="px-2 py-0.5 rounded-full bg-slate-200 dark:bg-[#222E4C]">{w.pos}</span>
                  <span className="px-2 py-0.5 rounded-full border border-[#E9B000]">{w.topic}</span>
                  <button onClick={stop(() => speak(w.es))} title="Nghe phát âm" aria-label="Nghe phát âm" className="text-base">🔊</button>
                </div>
              </div>
              {w.family.length > 0 && <div className="mt-2 flex flex-wrap gap-1">{w.family.map(f => <span key={f} className="text-xs px-2 py-0.5 rounded bg-slate-100 dark:bg-[#0F1626]">{f}</span>)}</div>}
              {(w.exEs || w.exVi) && <div className="mt-3 text-sm border-l-4 border-[#E9B000] pl-3"><p className="italic">{w.exEs}</p><p className="text-slate-500 dark:text-slate-400">{w.exVi}</p></div>}
              {w.note && <p className="mt-2 text-xs text-slate-500 dark:text-slate-400">📌 {w.note}</p>}
              <div className="mt-3 flex gap-2">
                <button className={btnSoft + ' !py-1 !px-3'} onClick={stop(() => onEdit(w))}>Sửa</button>
                <button className={btnSoft + ' !py-1 !px-3'} onClick={stop(() => confirm('Xóa thuật ngữ “' + w.es + '”?') && onDelete(w.id))}>Xóa</button>
              </div>
            </article>
          );
        })}
      </div>
      {openWord && <Detail key={openWord.id} w={openWord} emph={emph} onClose={() => setOpen(null)} onEdit={onEdit} />}
    </div>
  );
}

function AddForm({ initial, onSave, onCancel, topics, settings }) {
  const [f, setF] = useState(initial || emptyForm);
  const [fam, setFam] = useState('');
  const [busy, setBusy] = useState(false);
  const [msg, setMsg] = useState('');
  const set = (k, v) => setF(p => ({ ...p, [k]: v }));
  const addFam = () => { const v = fam.trim(); if (v && !f.family.includes(v)) set('family', [...f.family, v]); setFam(''); };

  const analyze = async () => {
    if (!f.es.trim()) return setMsg('Hãy nhập từ/cụm từ tiếng Tây Ban Nha trước.');
    if (!settings.apiKey) return setMsg('Chưa có Gemini API Key. Vào tab “Cài đặt” để dán key.');
    setBusy(true); setMsg('');
    const prompt = `Bạn là chuyên gia biên phiên dịch Tây Ban Nha - Việt. Phân tích thuật ngữ tiếng Tây Ban Nha: "${f.es.trim()}"` +
      (f.topic ? ` (chủ đề: ${f.topic})` : '') +
      `. Trả về DUY NHẤT một JSON với các khóa: "vi" (nghĩa tiếng Việt ngắn gọn, chuẩn thuật ngữ), "pos" (một trong: ${POS.join(', ')}), ` +
      `"family" (mảng các từ cùng họ tiếng Tây Ban Nha, tối đa 6), "exEs" (một câu ví dụ tiếng Tây Ban Nha), "exVi" (bản dịch tiếng Việt của câu đó), "note" (ghi chú ngắn: collocation hoặc false friend nếu có, nếu không để rỗng).`;
    try {
      const url = `https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(settings.model)}:generateContent?key=${encodeURIComponent(settings.apiKey)}`;
      const opts = { method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }], generationConfig: { responseMimeType: 'application/json', temperature: 0.3 } }) };
      let r, j;
      for (let n = 1; n <= 3; n++) {
        r = await fetch(url, opts);
        j = await r.json().catch(() => ({}));
        if (r.ok || (r.status !== 503 && r.status !== 429) || n === 3) break;
        setMsg('Máy chủ Gemini đang bận, thử lại lần ' + (n + 1) + '/3…');
        await new Promise(res => setTimeout(res, 1500 * n));
      }
      if (!r.ok) throw new Error((j.error && j.error.message) || 'Lỗi ' + r.status + (r.status === 503 ? ' (máy chủ Gemini quá tải, thử lại sau hoặc đổi model trong Cài đặt)' : ''));
      const txt = j.candidates?.[0]?.content?.parts?.map(p => p.text).join('') || '';
      const d = JSON.parse(txt.replace(/```json|```/g, '').trim());
      setF(p => ({ ...p, vi: d.vi || p.vi, pos: POS.includes(d.pos) ? d.pos : p.pos,
        family: Array.isArray(d.family) ? [...new Set([...p.family, ...d.family.map(String)])] : p.family,

        <Field label="Từ loại"><select className={inputCls} value={f.pos} onChange={e => set('pos', e.target.value)}>{POS.map(p => <option key={p}>{p}</option>)}</select></Field>
        <Field label="Chủ đề (chọn hoặc gõ chủ đề mới)">
          <input className={inputCls} list="topics" value={f.topic} onChange={e => set('topic', e.target.value)} />
          <datalist id="topics">{topics.map(t => <option key={t} value={t} />)}</datalist>
        </Field>
      </div>
      <button className={btnMain} disabled={busy} onClick={analyze}>{busy ? 'Đang phân tích…' : '✨ Tự động phân tích bằng AI'}</button>
      <Field label="Họ từ (Word Family) — gõ rồi nhấn Enter hoặc “Thêm”">
        <div className="flex gap-2">
          <input className={inputCls} value={fam} onChange={e => setFam(e.target.value)} onKeyDown={e => e.key === 'Enter' && (e.preventDefault(), addFam())} placeholder="gobierno" />
          <button type="button" className={btnSoft} onClick={addFam}>Thêm</button>
        </div>
      </Field>
      {f.family.length > 0 && <div className="flex flex-wrap gap-2">{f.family.map(x =>
        <span key={x} className="text-sm px-2 py-1 rounded bg-slate-100 dark:bg-[#0F1626]">{x}
          <button className="ml-2 text-slate-500" aria-label={'Bỏ ' + x} onClick={() => set('family', f.family.filter(y => y !== x))}>×</button></span>)}</div>}
      <div className="grid sm:grid-cols-2 gap-3">
        <Field label="Câu ví dụ (ES)"><textarea rows="2" className={inputCls} value={f.exEs} onChange={e => set('exEs', e.target.value)} /></Field>
        <Field label="Câu ví dụ (VI)"><textarea rows="2" className={inputCls} value={f.exVi} onChange={e => set('exVi', e.target.value)} /></Field>
      </div>
      <Field label="Ghi chú chuyên ngành (collocations, false friends…)"><textarea rows="2" className={inputCls} value={f.note} onChange={e => set('note', e.target.value)} /></Field>
      {msg && <p className="text-sm text-[#b88700] dark:text-[#E9B000]" role="status">{msg}</p>}
      <div className="flex gap-2"><button className={btnMain} onClick={submit}>Lưu thuật ngữ</button>{onCancel && <button className={btnSoft} onClick={onCancel}>Hủy</button>}</div>
    </div>
  );
}

const shuffle = a => { const b = [...a]; for (let i = b.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [b[i], b[j]] = [b[j], b[i]]; } return b; };

  const w = deck[i];
  const go = d => { setFlip(false); setTimeout(() => setI(x => (x + d + deck.length) % deck.length), 120); };
  const front = w && (dir === 'es-vi' ? { big: w.es, sub: 'Biên dịch ES → VI' } : { big: w.vi, sub: 'Phiên dịch VI → ES' });
  const back = w && (dir === 'es-vi' ? w.vi : w.es);

        <button className={dir === 'vi-es' ? btnMain : btnSoft} onClick={() => setDir('vi-es')}>Phiên dịch VI → ES</button>

          <div className={'flip-inner h-72 ' + (flip ? 'on' : '')}>
            <div className="face absolute inset-0 rounded-2xl bg-white dark:bg-[#18223A] border-2 border-slate-200 dark:border-slate-700 flex flex-col items-center justify-center p-6 text-center">
              <p className="text-xs text-slate-500 mb-3">{front.sub} · {w.topic}</p>
              <p className="text-4xl font-extrabold">{front.big}</p>
              <p className="text-xs text-slate-400 mt-6">Nhấn để lật</p>
            </div>
            <div className="face back rounded-2xl bg-[#14213D] text-white border-2 border-[#E9B000] flex flex-col items-center justify-center p-6 text-center">
              <p className="text-4xl font-extrabold text-[#E9B000]">{back}</p>
              <p className="text-xs mt-2 opacity-70">{w.pos}</p>
              {w.exEs && <p className="mt-4 text-sm italic opacity-90">{w.exEs}<br /><span className="not-italic opacity-60">{w.exVi}</span></p>}

              <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true"><path d="M16 3h5v5" /><path d="M4 20 21 3" /><path d="M21 16v5h-5" /><path d="M15 15l6 6" /><path d="M4 4l5 5" /></svg>
            </button>
            <button className={btnMain} onClick={() => go(1)}>Sau</button>
          </div>
        </div>

let audioCtx = null;
const getAudio = () => {
  try {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!audioCtx) audioCtx = new AC();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    return audioCtx;
  } catch (e) { return null; }
};
const tone = (freq, dur, type, vol, delay = 0) => {
  const c = getAudio(); if (!c) return;
  const t = c.currentTime + delay;
  const o = c.createOscillator(), g = c.createGain();
  o.type = type; o.frequency.value = freq;
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(c.destination);
  o.start(t); o.stop(t + dur + 0.02);
};
const tick = n => tone(n % 2 ? 1500 : 1100, 0.05, 'square', 0.06);
const bell = () => [0, 0.9].forEach(d => { tone(880, 1.4, 'sine', 0.25, d); tone(2430, 1.0, 'sine', 0.1, d); tone(4750, 0.6, 'sine', 0.05, d); });

function Drill({ words, topics, sound, setSound }) {
  const [topic, setTopic] = useState('');
  const [dir, setDir] = useState('es-vi');
  const [secs, setSecs] = useState(5);
  const [cur, setCur] = useState(null);
  const [left, setLeft] = useState(0);
  const [show, setShow] = useState(false);
  const [score, setScore] = useState({ ok: 0, no: 0 });
  const soundRef = useRef(sound);
  soundRef.current = sound;
  const pool = useMemo(() => words.filter(w => !topic || w.topic === topic), [words, topic]);
  const next = () => {
    if (!pool.length) return;
    getAudio();
    let w; do { w = pool[Math.floor(Math.random() * pool.length)]; } while (pool.length > 1 && cur && w.id === cur.id);
    setCur(w); setShow(false); setLeft(secs);
  };
  useEffect(() => {
    if (!cur || show) return;
    if (left <= 0) { setShow(true); if (soundRef.current) bell(); return; }
    const t = setTimeout(() => {
      const n = left - 1;
      setLeft(n);
      if (soundRef.current && n > 0) tick(n);
    }, 1000);
    return () => clearTimeout(t);
  }, [cur, show, left]);
  const mark = ok => { setScore(s => ok ? { ...s, ok: s.ok + 1 } : { ...s, no: s.no + 1 }); next(); };
  const prompt = cur && (dir === 'es-vi' ? cur.es : cur.vi);
  const answer = cur && (dir === 'es-vi' ? cur.vi : cur.es);
  return (
    <div className="max-w-xl mx-auto">
      <div className="flex flex-wrap gap-2 mb-4 items-center">
        <button className={dir === 'es-vi' ? btnMain : btnSoft} onClick={() => setDir('es-vi')}>ES → VI</button>
        <button className={dir === 'vi-es' ? btnMain : btnSoft} onClick={() => setDir('vi-es')}>VI → ES</button>
        {[3, 5, 10].map(s => <button key={s} className={secs === s ? btnMain : btnSoft} onClick={() => setSecs(s)}>{s}s</button>)}
        <TopicPick topics={topics} topic={topic} setTopic={setTopic} />
        <button className={(sound ? btnMain : btnSoft) + ' ml-auto'} aria-pressed={sound} title={sound ? 'Đang bật âm thanh (bấm để tắt)' : 'Đang tắt âm thanh (bấm để bật)'}
          aria-label={sound ? 'Tắt âm thanh' : 'Bật âm thanh'} onClick={() => { const v = !sound; setSound(v); if (v) { getAudio(); tick(1); } }}>{sound ? '🔊' : '🔇'}</button>
      </div>
      <div className="rounded-2xl bg-white dark:bg-[#18223A] border-2 border-slate-200 dark:border-slate-700 p-6 text-center min-h-[18rem] flex flex-col items-center justify-center">
        {!cur ? <>
          <p className="mb-4 text-slate-500">Dịch nhẩm hoặc nói to trước khi hết giờ, rồi tự chấm.</p>
          <button className={btnMain} disabled={!pool.length} onClick={next}>Bắt đầu luyện</button>
          {!pool.length && <p className="mt-3 text-sm text-slate-500">Chưa có thuật ngữ nào để luyện.</p>}
        </> : <>
          <div className="w-full h-2 rounded bg-slate-200 dark:bg-[#0F1626] mb-4 overflow-hidden"><div className="h-2 bg-[#E9B000]" style={{ width: show ? '0%' : (left / secs * 100) + '%', transition: 'width 1s linear' }} /></div>
          <p className="text-5xl font-extrabold tabular-nums mb-3">{show ? '⏱' : left}</p>
          <p className="text-3xl font-extrabold">{prompt}</p>
          {show ? <p className="mt-5 text-3xl font-extrabold text-[#b88700] dark:text-[#E9B000]">{answer}</p> :
            <button className={btnSoft + ' mt-5'} onClick={() => setShow(true)}>Hiện đáp án</button>}
        </>}
      </div>
      {cur && show && <div className="flex gap-2 justify-center mt-4">
        <button className={btnSoft} onClick={() => mark(false)}>Chưa nhớ</button>
        <button className={btnMain} onClick={() => mark(true)}>Đã nhớ</button></div>}
      <p className="text-center text-sm text-slate-500 mt-3">Đã nhớ {score.ok} · Chưa nhớ {score.no}</p>
    </div>
  );
}

function Settings({ settings, setSettings, words, setWords, tombs, applyState, onSync, syncing, syncMsg, canInstall, onInstall, gistSync, gistCreate, gistBusy, gistMsg }) {
  const fileRef = useRef();

  const [codeIn, setCodeIn] = useState('');
  const [codeMsg, setCodeMsg] = useState('');

  const copyCode = async () => { try { await navigator.clipboard.writeText(codeOut); setCodeMsg('Đã sao chép mã.'); } catch (e) { setCodeMsg('Không tự sao chép được, hãy bôi đen ô mã rồi copy.'); } };
  const applyCode = async () => {
    try {
      const d = await decodeCode(codeIn);
      if (!Array.isArray(d.words)) throw new Error('Mã không chứa danh sách từ.');
      const before = words.length, m = applyState(d);
      setCodeMsg(`Đã gộp xong: ${before} → ${m.words.length} từ.`); setCodeIn('');
    } catch (e) { setCodeMsg('Không đọc được mã: ' + e.message); }
  };
  const [msg, setMsg] = useState('');
  const toCSV = () => {
    const q = s => '"' + String(s || '').replace(/"/g, '""') + '"';
    const rows = [['es', 'vi', 'pos', 'topic', 'family', 'exEs', 'exVi', 'note'].join(',')]
      .concat(words.map(w => [w.es, w.vi, w.pos, w.topic, w.family.join('; '), w.exEs, w.exVi, w.note].map(q).join(',')));
    download('glosario-es-vi.csv', '\uFEFF' + rows.join('\n'), 'text/csv;charset=utf-8');

        <p className="text-sm text-slate-500 dark:text-slate-400">Giữ một file JSON trên GitHub (mặc định <code>vocab.json</code> cạnh <code>index.html</code>). Mọi thiết bị bấm đồng bộ sẽ kéo các từ mới về. Đồng bộ chỉ thêm hoặc cập nhật từ, không xóa từ.</p>
        <Field label="Địa chỉ file JSON (đường dẫn tương đối hoặc link raw.githubusercontent.com)"><input className={inputCls} value={settings.syncUrl} onChange={e => setSettings({ ...settings, syncUrl: e.target.value })} placeholder="vocab.json" /></Field>
        <label className="flex items-center gap-2 text-sm"><input type="checkbox" checked={settings.autoSync} onChange={e => setSettings({ ...settings, autoSync: e.target.checked })} /> Tự đồng bộ mỗi khi mở ứng dụng</label>
        <label className="flex items-center gap-2 text-sm"><input type="checkbox" checked={settings.overwrite} onChange={e => setSettings({ ...settings, overwrite: e.target.checked })} /> Ghi đè nội dung nếu từ đã có (lấy bản trên GitHub làm chuẩn)</label>
        <button className={btnMain} disabled={syncing} onClick={() => onSync(false)}>{syncing ? 'Đang đồng bộ…' : '⟳ Đồng bộ ngay'}</button>
        {syncMsg && <p className="text-sm text-[#b88700] dark:text-[#E9B000]" role="status">{syncMsg}</p>}
      </section>
      <section className="rounded-xl bg-white dark:bg-[#18223A] border border-slate-200 dark:border-slate-700 p-5 space-y-3">
        <h2 className="text-xl font-extrabold">Cài đặt thành ứng dụng</h2>
        <p className="text-sm text-slate-500 dark:text-slate-400">Android/Chrome/Edge: bấm nút bên dưới (hoặc menu ⋮ → Cài đặt ứng dụng). iPhone/iPad: mở bằng Safari, bấm nút Chia sẻ → Thêm vào MH chính. Sau khi cài, ứng dụng mở toàn màn hình và vẫn dùng được khi mất mạng.</p>
        {canInstall ? <button className={btnMain} onClick={onInstall}>Cài đặt ứng dụng</button> : <p className="text-sm text-slate-500">Nút cài đặt chỉ hiện khi trình duyệt cho phép (cần mở bằng link https, không phải file trên máy, và chưa cài trước đó).</p>}
      </section>
      <section className="rounded-xl bg-white dark:bg-[#18223A] border border-slate-200 dark:border-slate-700 p-5 space-y-3">
        <h2 className="text-xl font-extrabold">Sao lưu dữ liệu</h2>
        <div className="flex flex-wrap gap-2">
          <button className={btnMain} onClick={() => download('glosario-es-vi.json', JSON.stringify(words, null, 2), 'application/json')}>Xuất JSON</button>
          <button className={btnSoft} onClick={toCSV}>Xuất CSV</button>
          <button className={btnSoft} onClick={() => fileRef.current.click()}>Nhập JSON</button>
          <input ref={fileRef} type="file" accept=".json,application/json" className="hidden" onChange={onImport} />
        </div>
        {msg && <p className="text-sm text-[#b88700] dark:text-[#E9B000]" role="status">{msg}</p>}
        <p className="text-xs text-slate-500">Mỗi mục JSON gồm: es, vi, pos, topic, family (mảng), exEs, exVi, note. Mục trùng từ tiếng Tây Ban Nha sẽ được bỏ qua.</p>
      </section>
    </div>
  );
}

function App() {
  const [words, setWords] = useState(() => load(KEY, []));
  const [settings, setSettings] = useState(() => ({ apiKey: '', model: 'gemini-2.5-flash', syncUrl: 'vocab.json', autoSync: false, overwrite: false, emph: 'vi', sound: true, gistToken: '', gistId: '', gistAuto: true, ...load(KEY + '_cfg', {}) }));
  const [tombs, setTombs] = useState(() => load(KEY + '_tomb', {}));
  const tombsRef = useRef({});
  tombsRef.current = tombs;
  const [gistBusy, setGistBusy] = useState(false);
  const [gistMsg, setGistMsg] = useState('');
  const gistBusyRef = useRef(false);
  const gistSyncRef = useRef(null);
  const firstRun = useRef(true);
  const wordsRef = useRef([]);
  wordsRef.current = words;
  const [syncing, setSyncing] = useState(false);
  const [syncMsg, setSyncMsg] = useState('');
  const [installEvt, setInstallEvt] = useState(null);
  const [tab, setTab] = useState('lib');
  const [dark, setDark] = useState(() => document.documentElement.classList.contains('dark'));
  const [editing, setEditing] = useState(null);
  const [q, setQ] = useState('');
  const [topic, setTopic] = useState('');
  useEffect(() => save(KEY, words), [words]);
  useEffect(() => save(KEY + '_tomb', tombs), [tombs]);
  useEffect(() => save(KEY + '_cfg', settings), [settings]);
  useEffect(() => { document.documentElement.classList.toggle('dark', dark); save('glo_dark', dark ? '1' : '0'); try { localStorage.setItem('glo_dark', dark ? '1' : '0'); } catch (e) {} }, [dark]);
  const topics = useMemo(() => [...new Set([...TOPICS, ...words.map(w => w.topic).filter(Boolean)])], [words]);

  const syncNow = async (silent) => {
    setSyncing(true);
    if (!silent) setSyncMsg('');
    try {
      const base = new URL(settings.syncUrl || 'vocab.json', location.href).href;
      const r = await fetch(base + (base.includes('?') ? '&' : '?') + 't=' + Date.now(), { cache: 'no-store' });
      if (!r.ok) throw new Error('HTTP ' + r.status + (r.status === 404 ? ' (chưa có file vocab.json trên GitHub?)' : ''));
      const data = await r.json();
      const arr = Array.isArray(data) ? data : data.words;
      if (!Array.isArray(arr)) throw new Error('File phải là mảng JSON các thuật ngữ.');
      const res = mergeWords(wordsRef.current, arr, settings.overwrite, tombsRef.current);
      setWords(res.list);
      setSyncMsg(`Đồng bộ xong: thêm ${res.added}, cập nhật ${res.updated}, bỏ qua ${res.skipped}.`);
    } catch (e) { setSyncMsg('Không đồng bộ được: ' + e.message); }
    setSyncing(false);
  };

  const gistReady = !!(settings.gistToken.trim() && settings.gistId.trim());
  const gistSync = async (silent, auto) => {
    if (auto && !settings.gistAuto) return;
    if (!gistReady) { if (!silent) setGistMsg('Chưa nhập token và Gist ID.'); return; }
    if (gistBusyRef.current) return;
    gistBusyRef.current = true; setGistBusy(true);
    const tk = settings.gistToken.trim(), id = encodeURIComponent(settings.gistId.trim());
    try {
      const r = await gh('/gists/' + id, {}, tk);
      if (!r.ok) throw new Error(r.status === 401 ? 'Token sai hoặc đã hết hạn (401).' : r.status === 404 ? 'Không tìm thấy Gist (404): kiểm tra Gist ID và quyền gist của token.' : 'Lỗi ' + r.status);
      const g = await r.json();
      const f = g.files && g.files[GIST_FILE];
      let remote = { words: [], deleted: {} };
      if (f) {
        const text = f.truncated ? await (await fetch(f.raw_url)).text() : f.content;
        try { remote = JSON.parse(text); } catch (e) { throw new Error('File đồng bộ trong Gist bị hỏng.'); }
      }
      const local = { words: wordsRef.current, deleted: tombsRef.current };
      const merged = mergeState(local, remote);
      if (canon(merged) !== canon(local)) { setWords(merged.words); setTombs(merged.deleted); }
      let pushed = false;
      if (canon(merged) !== canon({ words: remote.words || [], deleted: remote.deleted || {} })) {
        const body = JSON.stringify({ files: { [GIST_FILE]: { content: JSON.stringify({ version: 1, savedAt: Date.now(), words: merged.words, deleted: merged.deleted }) } } });
        const pr = await gh('/gists/' + id, { method: 'PATCH', body }, tk);
        if (!pr.ok) throw new Error('Không ghi được lên Gist (' + pr.status + '). Token cần quyền gist.');
        pushed = true;
      }
      setGistMsg('Đã đồng bộ lúc ' + new Date().toLocaleTimeString('vi-VN') + (pushed ? ' · đã cập nhật Gist.' : '.'));
    } catch (e) { setGistMsg('Không đồng bộ được: ' + e.message); }
    gistBusyRef.current = false; setGistBusy(false);
  };
  gistSyncRef.current = gistSync;
  const gistCreate = async () => {
    const tk = settings.gistToken.trim();
    if (!tk) return setGistMsg('Hãy dán token trước.');
    setGistBusy(true);
    try {
      const content = JSON.stringify({ version: 1, savedAt: Date.now(), words: wordsRef.current, deleted: tombsRef.current });
      const r = await gh('/gists', { method: 'POST', body: JSON.stringify({ description: 'Glosario ES–VI – dữ liệu đồng bộ riêng tư', public: false, files: { [GIST_FILE]: { content } } }) }, tk);
      if (!r.ok) throw new Error(r.status === 401 ? 'Token sai hoặc đã hết hạn (401).' : r.status === 403 || r.status === 404 ? 'Token không đủ quyền tạo Gist (' + r.status + ').' : 'Lỗi ' + r.status);
      const g = await r.json();
      setSettings(c => ({ ...c, gistId: g.id }));
      setGistMsg('Đã tạo Gist riêng tư. Trên máy còn lại hãy nhập cùng token và Gist ID: ' + g.id);
    } catch (e) { setGistMsg('Không tạo được Gist: ' + e.message); }
    setGistBusy(false);
  };
  const applyState = remote => {
    const merged = mergeState({ words: wordsRef.current, deleted: tombsRef.current }, remote);
    setWords(merged.words); setTombs(merged.deleted);
    return merged;
  };
  const deleteWord = id => {
    const w = words.find(x => x.id === id);
    if (w) setTombs(t => ({ ...t, [keyOf(w)]: Date.now() }));
    setWords(words.filter(x => x.id !== id));
  };
  useEffect(() => {
    if (firstRun.current) { firstRun.current = false; return; }
    if (!settings.gistAuto || !gistReady) return;
    const t = setTimeout(() => gistSyncRef.current && gistSyncRef.current(true), 3000);
    return () => clearTimeout(t);
  }, [words, tombs]);
  useEffect(() => {
    const onVis = () => { if (document.visibilityState === 'visible' && gistSyncRef.current) gistSyncRef.current(true, true); };
    document.addEventListener('visibilitychange', onVis);
    return () => document.removeEventListener('visibilitychange', onVis);
  }, []);

  useEffect(() => {
    if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});
    const onPrompt = e => { e.preventDefault(); setInstallEvt(e); };
    window.addEventListener('beforeinstallprompt', onPrompt);
    window.addEventListener('appinstalled', () => setInstallEvt(null));
    if (settings.autoSync && location.protocol.startsWith('http')) syncNow(true);
    if (settings.gistAuto && gistReady && location.protocol.startsWith('http')) gistSync(true);
    return () => window.removeEventListener('beforeinstallprompt', onPrompt);
  }, []);
  const install = async () => { if (!installEvt) return; installEvt.prompt(); await installEvt.userChoice; setInstallEvt(null); };

  const saveWord = w => {
    const stamped = { ...w, updated: Date.now() };
    if (w.id) {
      const old = words.find(x => x.id === w.id);
      if (old && keyOf(old) !== keyOf(w)) setTombs(t => ({ ...t, [keyOf(old)]: Date.now() }));
      setWords(words.map(x => x.id === w.id ? stamped : x));
    } else {
      setTombs(t => { const n = { ...t }; delete n[keyOf(w)]; return n; });
      setWords([{ ...stamped, id: crypto.randomUUID(), created: Date.now() }, ...words]);
    }
    if (w.id) { setEditing(null); setTab('lib'); }
  };
  const tabs = [['lib', 'Thư viện'], ['add', 'Thêm từ'], ['card', 'Flashcard'], ['drill', 'Phản xạ'], ['set', 'Cài đặt']];

  return (
    <div className="max-w-5xl mx-auto px-4 pb-16">
      <header className="flex items-center justify-between py-5">
        <div className="flex items-center gap-3">
          <img src="icon-192.png" alt="Logo Glosario ES–VI" className="w-12 h-12 rounded-xl shadow" />
          <div>
            <h1 className="text-2xl sm:text-3xl font-extrabold tracking-tight">Glosario ES–VI</h1>
            <p className="text-sm text-slate-500 dark:text-slate-400">Thuật ngữ biên phiên dịch Tây Ban Nha – Việt</p>
          </div>
        </div>
        <div className="flex gap-2">
          <button className={btnSoft} disabled={syncing} onClick={() => (gistReady ? gistSync(false) : syncNow(false))} aria-label="Đồng bộ từ vựng">{(syncing || gistBusy) ? '…' : '⟳ Đồng bộ'}</button>
          <button className={btnSoft} onClick={() => setDark(!dark)} aria-label="Đổi giao diện sáng/tối">{dark ? '☀️' : '🌙'}</button>
        </div>
      </header>
      <nav className="flex gap-1 overflow-x-auto mb-6 border-b border-slate-300 dark:border-slate-700">
        {tabs.map(([k, l]) => (
          <button key={k} onClick={() => { setTab(k); if (k !== 'add') setEditing(null); }}
            className={'px-4 py-2 text-sm font-semibold whitespace-nowrap border-b-4 ' + (tab === k ? 'border-[#E9B000]' : 'border-transparent text-slate-500 hover:text-slate-900 dark:hover:text-white')}>{l}</button>
        ))}
      </nav>
      {(syncMsg || gistMsg) && tab !== 'set' && <p className="mb-4 text-sm rounded-lg px-3 py-2 bg-[#E9B000]/20" role="status">{gistMsg || syncMsg} <button className="underline ml-2" onClick={() => { setSyncMsg(''); setGistMsg(''); }}>Đóng</button></p>}
      <main>
        {tab === 'lib' && <Library words={words} topics={topics} q={q} setQ={setQ} topic={topic} setTopic={setTopic} emph={settings.emph} setEmph={v => setSettings(c => ({ ...c, emph: v }))}
          onEdit={w => { setEditing(w); setTab('add'); }} onDelete={deleteWord} />}
        {tab === 'add' && <AddForm key={editing ? editing.id : 'new'} initial={editing} topics={topics} settings={settings}
          onSave={saveWord} onCancel={editing ? () => { setEditing(null); setTab('lib'); } : null} />}
        {tab === 'card' && <Cards words={words} topics={topics} />}
        {tab === 'drill' && <Drill words={words} topics={topics} sound={settings.sound} setSound={v => setSettings(c => ({ ...c, sound: v }))} />}
        {tab === 'set' && <Settings settings={settings} setSettings={setSettings} words={words} setWords={setWords}
          tombs={tombs} applyState={applyState} onSync={syncNow} syncing={syncing} syncMsg={syncMsg} canInstall={!!installEvt} onInstall={install}
          gistSync={gistSync} gistCreate={gistCreate} gistBusy={gistBusy} gistMsg={gistMsg} />}
      </main>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
