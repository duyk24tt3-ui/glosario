<script type="text/babel">
const { useState, useEffect, useMemo, useRef } = React;

const POS = ['Danh từ', 'Động từ', 'Tính từ', 'Trạng từ', 'Cụm từ'];
const TOPICS = ['Luật', 'Kinh tế', 'Y tế', 'Ngoại giao', 'Du lịch', 'Văn hóa', 'Kỹ thuật', 'Chung'];
const KEY = 'glosario_es_vi_v1';
const emptyForm = { es: '', vi: '', pos: 'Danh từ', topic: 'Chung', family: [], exEs: '', exVi: '', note: '' };

const load = (k, d) => { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } };
const save = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };
const norm = s => (s || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/đ/g, 'd');
const speak = t => { try { const u = new SpeechSynthesisUtterance(t); u.lang = 'es-ES'; speechSynthesis.cancel(); speechSynthesis.speak(u); } catch (e) {} };
const download = (name, text, type) => {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], { type }));
  a.download = name; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
};

// Gộp danh sách từ bên ngoài vào danh sách hiện có (so khớp theo từ tiếng Tây Ban Nha, không phân biệt dấu/hoa thường)
const mergeWords = (current, incoming, overwrite, tombs = {}) => {
  const idx = new Map(current.map((w, i) => [norm(w.es), i]));
  const list = [...current];
  let added = 0, updated = 0, skipped = 0;
  incoming.forEach(w => {
    if (!w || !w.es || !w.vi) { skipped++; return; }
    const clean = { ...emptyForm, ...w, family: Array.isArray(w.family) ? w.family : [] };
    const k = norm(w.es);
    if (idx.has(k)) {
      if (overwrite) { list[idx.get(k)] = { ...clean, id: list[idx.get(k)].id, updated: Date.now() }; updated++; } else skipped++;
    } else {
      if (tombs[k]) { skipped++; return; }
      idx.set(k, list.length);
      list.push({ ...clean, id: crypto.randomUUID(), created: Date.now(), updated: w.updated || Date.now() }); added++;
    }
  });
  return { list, added, updated, skipped };
};

// ===== Đồng bộ hai chiều: gộp theo từ khóa (không phân biệt dấu), có "bia mộ" cho từ đã xóa =====
const keyOf = w => norm(w.es);
const mergeState = (local, remote) => {
  const lm = new Map(local.words.map(w => [keyOf(w), w]));
  const rm = new Map((remote.words || []).filter(w => w && w.es && w.vi).map(w => [keyOf(w), w]));
  const tomb = {};
  [local.deleted, remote.deleted].forEach(d => Object.entries(d || {}).forEach(([k, t]) => { tomb[k] = Math.max(tomb[k] || 0, t); }));
  const words = [], deleted = {};
  new Set([...lm.keys(), ...rm.keys(), ...Object.keys(tomb)]).forEach(k => {
    const l = lm.get(k), r = rm.get(k);
    let w = null;
    if (l && r) w = (r.updated || 0) > (l.updated || 0) ? { ...emptyForm, ...r, family: Array.isArray(r.family) ? r.family : [], id: l.id } : l;
    else if (l) w = l;
    else if (r) w = { ...emptyForm, ...r, family: Array.isArray(r.family) ? r.family : [], id: r.id || crypto.randomUUID() };
    if (tomb[k] && (!w || tomb[k] >= (w.updated || 0))) deleted[k] = tomb[k];
    else if (w) words.push(w);
  });
  return { words, deleted };
};
const canon = st => JSON.stringify({
  w: st.words.map(w => [keyOf(w), w.es, w.vi, w.pos || '', w.topic || '', w.family || [], w.exEs || '', w.exVi || '', w.note || '', w.updated || 0]).sort((a, b) => (a[0] < b[0] ? -1 : a[0] > b[0] ? 1 : 0)),
  d: Object.entries(st.deleted || {}).sort()
});
const GIST_FILE = 'glosario-sync.json';
const gh = (path, opts, token) => fetch('https://api.github.com' + path, { ...opts,
  headers: { Accept: 'application/vnd.github+json', Authorization: 'Bearer ' + token, ...(opts && opts.body ? { 'Content-Type': 'application/json' } : {}) } });
const b64enc = bytes => { let t = ''; bytes.forEach(b => { t += String.fromCharCode(b); }); return btoa(t).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''); };
const b64dec = str => { let t = str.replace(/-/g, '+').replace(/_/g, '/'); while (t.length % 4) t += '='; return Uint8Array.from(atob(t), c => c.charCodeAt(0)); };
const streamBytes = async (bytes, Ctor) => { const st = new Ctor('gzip'); const w = st.writable.getWriter(); w.write(bytes); w.close(); return new Uint8Array(await new Response(st.readable).arrayBuffer()); };
const encodeCode = async data => {
  const bytes = new TextEncoder().encode(JSON.stringify(data));
  return typeof CompressionStream !== 'undefined' ? 'GLO1:' + b64enc(await streamBytes(bytes, CompressionStream)) : 'GLO0:' + b64enc(bytes);
};
const decodeCode = async code => {
  const c = code.trim(), i = c.indexOf(':');
  const tag = c.slice(0, i), body = c.slice(i + 1).replace(/\s+/g, '');
  if (tag !== 'GLO1' && tag !== 'GLO0') throw new Error('Mã không bắt đầu bằng GLO1: hoặc GLO0:.');
  let bytes = b64dec(body);
  if (tag === 'GLO1') {
    if (typeof DecompressionStream === 'undefined') throw new Error('Trình duyệt này không giải nén được mã GLO1.');
    bytes = await streamBytes(bytes, DecompressionStream);
  }
  return JSON.parse(new TextDecoder().decode(bytes));
};

const inputCls = 'input';
const btn = 'btn';
const btnMain = 'btn btn-primary';
const btnSoft = 'btn btn-secondary';

const ICONS = {
  library: 'M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z|M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z',
  plus: 'M5 12h14|M12 5v14', cards: 'M7 7h13v13H7z|M4 17V4h13', zap: 'M13 2 3 14h9l-1 8 10-12h-9z',
  settings: 'M21 4h-7|M10 4H3|M21 12h-9|M8 12H3|M21 20h-5|M12 20H3|M14 2v4|M8 10v4|M16 18v4',
  sync: 'M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8|M21 3v5h-5|M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16|M8 16H3v5',
  sun: 'M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8z|M12 2v2|M12 20v2|m4.93 4.93 1.41 1.41|m17.66 17.66 1.41 1.41|M2 12h2|M20 12h2|m6.34 17.66-1.41 1.41|m19.07 4.93-1.41 1.41',
  moon: 'M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9z', vol: 'M11 5 6 9H2v6h4l5 4z|M15.54 8.46a5 5 0 0 1 0 7.07|M19.07 4.93a10 10 0 0 1 0 14.14',
  mute: 'M11 5 6 9H2v6h4l5 4z|m22 9-6 6|m16 9 6 6', x: 'M18 6 6 18|m6 6 12 12', search: 'm21 21-4.3-4.3|M11 19a8 8 0 1 0 0-16 8 8 0 0 0 0 16z',
  edit: 'M12 20h9|M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4z', trash: 'M3 6h18|M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6|M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2',
  sparkles: 'M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9z|M19 3v4|M17 5h4', left: 'm15 18-6-6 6-6', right: 'm9 18 6-6-6-6',
  shuffle: 'M16 3h5v5|M4 20 21 3|M21 16v5h-5|M15 15l6 6|M4 4l5 5', ext: 'M15 3h6v6|M10 14 21 3|M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6',
  eye: 'M2 12s3-7 10-7 10 7 10 7-3 7-10 7S2 12 2 12z|M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6z',
  eyeoff: 'M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 10 8 10 8a13.16 13.16 0 0 1-1.67 2.68|M6.61 6.61A13.53 13.53 0 0 0 2 12s3 8 10 8a9.74 9.74 0 0 0 5.39-1.61|m2 2 20 20',
  clock: 'M12 6v6l4 2|M12 22a10 10 0 1 0 0-20 10 10 0 0 0 0 20z', check: 'M20 6 9 17l-5-5', redo: 'M3 12a9 9 0 1 0 3-6.7L3 8|M3 3v5h5'
};
const Icon = ({ n, s = 18 }) => (
  <svg viewBox="0 0 24 24" width={s} height={s} fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true">

    <path d="M15 33q6-1.6 12 1M15 39q6-1.6 12 1" stroke="#14213D" strokeOpacity=".28" strokeWidth="2" strokeLinecap="round" fill="none" />
    <path d="M37 7h15a4 4 0 0 1 4 4v7a4 4 0 0 1-4 4h-5l-5.5 5v-5H37a4 4 0 0 1-4-4v-7a4 4 0 0 1 4-4z" fill="#E9B000" />
    <circle cx="40.5" cy="14.5" r="1.7" fill="#14213D" /><circle cx="44.5" cy="14.5" r="1.7" fill="#14213D" /><circle cx="48.5" cy="14.5" r="1.7" fill="#14213D" />
  </svg>
);
const EmptyArt = ({ title, text, action }) => (
  <div className="card p-10 text-center flex flex-col items-center gap-3">
    <svg viewBox="0 0 120 80" width="140" aria-hidden="true">
      <rect x="14" y="62" width="92" height="7" rx="3.5" fill="var(--surface2)" />
      <path d="M20 58V20c14-5 28-4 40 3v35c-12-7-26-8-40-4z" fill="var(--art)" />
      <path d="M100 58V20c-14-5-28-4-40 3v35c12-7 26-8 40-4z" fill="#E9B000" />
      <path d="M60 23v35" stroke="#F7F5EF" strokeWidth="2" />
      <path d="M28 30q10-2 20 2M28 38q10-2 20 2" stroke="#F7F5EF" strokeOpacity=".5" strokeWidth="2" strokeLinecap="round" fill="none" />
    </svg>
    <h3 className="h-display text-lg font-bold">{title}</h3>
    <p className="t-muted text-sm max-w-sm">{text}</p>
    {action}
  </div>
);
const Seg = ({ value, onChange, options, label }) => (
  <div className="seg" role="group" aria-label={label}>
    {options.map(([k, l]) => <button key={k} onClick={() => onChange(k)} aria-pressed={value === k} className={value === k ? 'on' : ''}>{l}</button>)}
  </div>
);
const Section = ({ n, title, children }) => (
  <section className="card p-5 space-y-4">
    <h2 className="h-display text-base font-bold flex items-center gap-2"><span className="step">{n}</span>{title}</h2>
    {children}
  </section>
);
const Notice = ({ text }) => <p className={'notice ' + (/^(Không|Hãy|Chưa|Cần)/.test(text) ? 'notice-err' : 'notice-ok')} role="status">{text}</p>;
const PageHead = ({ title, text }) => <div><h1 className="h-display text-3xl font-extrabold t-brand">{title}</h1><p className="t-muted mt-1 max-w-2xl">{text}</p></div>;
function SecretInput({ label, value, onChange }) {
  const [show, setShow] = useState(false);
  return (
    <Field label={label}>
      <div className="relative">
        <input type={show ? 'text' : 'password'} autoComplete="off" spellCheck="false" className="input !pr-12" value={value} onChange={onChange} />
        <button type="button" className="btn btn-ghost btn-icon absolute right-0.5 top-1/2 -translate-y-1/2" onClick={() => setShow(!show)} aria-label={show ? 'Ẩn giá trị' : 'Hiện giá trị'} title={show ? 'Ẩn' : 'Hiện'}><Icon n={show ? 'eyeoff' : 'eye'} /></button>
      </div>
    </Field>
  );
}
function Field({ label, hint, children }) {
  return <label className="block"><span className="field-label">{label}</span>{children}{hint && <span className="text-xs t-muted mt-1 block">{hint}</span>}</label>;
}

const lookupCache = {};
function Detail({ w, onClose, onEdit, emph }) {
  const [term, setTerm] = useState(w.es);
  const [box, setBox] = useState(w.es);
  const [st, setSt] = useState({ loading: true, text: '', err: '' });
  useEffect(() => {
    const h = e => e.key === 'Escape' && onClose();
    window.addEventListener('keydown', h);
    return () => window.removeEventListener('keydown', h);
  }, []);
  useEffect(() => {
    let dead = false;
    if (lookupCache[term]) { setSt(lookupCache[term]); return; }
    setSt({ loading: true, text: '', err: '' });
    fetch(`https://es.wiktionary.org/w/api.php?action=query&prop=extracts&explaintext=1&redirects=1&format=json&origin=*&titles=${encodeURIComponent(term)}`)
      .then(r => r.json()).then(j => {
        const pg = Object.values((j.query && j.query.pages) || {})[0];
        let t = pg && pg.extract;
        if (!t) throw new Error('Wiktionary tiếng Tây Ban Nha chưa có mục “' + term + '”. Thử các nút tra cứu bên dưới.');
        const m = t.match(/(?:^|\n)==\s*Español\s*==\s*\n([\s\S]*?)(?=\n==\s*[^=]|$)/);
        if (m) t = m[1];
        t = t.replace(/^=+\s*(.*?)\s*=+$/gm, '▸ $1').replace(/\n{3,}/g, '\n\n').trim();
        if (t.length > 1800) t = t.slice(0, 1800) + '…';
        const v = { loading: false, text: t, err: '' };
        lookupCache[term] = v;
        if (!dead) setSt(v);
      }).catch(e => { if (!dead) setSt({ loading: false, text: '', err: e.message || 'Không tải được (kiểm tra kết nối mạng).' }); });
    return () => { dead = true; };
  }, [term]);
  const go = t => { const v = t.trim(); if (v) { setTerm(v); setBox(v); } };
  const e = encodeURIComponent(term);
  const links = [
    ['RAE (DLE)', `https://dle.rae.es/${e}`],
    ['WordReference', `https://www.wordreference.com/definicion/${e}`],
    ['DeepL ES→VI', `https://www.deepl.com/translator#es/vi/${e}`],
    ['WordReference ES–EN', `https://www.wordreference.com/es/en/translation.asp?spen=${e}`],
    ['Google Dịch', `https://translate.google.com/?sl=es&tl=vi&op=translate&text=${e}`],
    ['Wiktionary', `https://es.wiktionary.org/wiki/${e}`],
  ];
  const big = emph === 'vi' ? w.vi : w.es, small = emph === 'vi' ? w.es : w.vi;
  const forms = [w.es, ...w.family.filter(f => f !== w.es)];
  return (
    <div className="fixed inset-0 z-50 flex items-end sm:items-center justify-center sm:p-6 modal-bg" onClick={onClose}>
      <div className="sheet card w-full sm:max-w-2xl max-h-[92vh] overflow-y-auto !rounded-b-none sm:!rounded-b-2xl p-5 sm:p-6 space-y-5" role="dialog" aria-modal="true" aria-label={'Chi tiết ' + w.es} onClick={ev => ev.stopPropagation()}>
        <div className="flex items-start justify-between gap-3">
          <div className="min-w-0">
            <div className="flex flex-wrap gap-2 mb-2"><span className="badge badge-gold">{w.topic}</span><span className="badge">{w.pos}</span></div>
            <h2 className={'h-display text-3xl leading-tight t-brand ' + (emph === 'es' ? 'font-bold' : 'font-semibold')}>{big}</h2>
            <p className={'text-lg t-muted mt-1 ' + (emph === 'es' ? 'font-medium' : 'font-semibold')}>{small}</p>
          </div>
          <div className="flex gap-1 shrink-0">
            <button className="btn btn-secondary btn-icon" onClick={() => speak(w.es)} aria-label="Nghe phát âm" title="Nghe phát âm"><Icon n="vol" /></button>
            <button className="btn btn-secondary btn-icon" onClick={onClose} aria-label="Đóng" title="Đóng"><Icon n="x" /></button>
          </div>
        </div>
        {(w.exEs || w.exVi) && <div className="rounded-xl p-4 border-l-4 border-[#E9B000]" style={{ background: 'var(--surface2)' }}>
          <p className="font-medium italic">{w.exEs}</p><p className="t-muted mt-1">{w.exVi}</p>
          <p className="mt-3 flex flex-wrap gap-x-4 gap-y-1 text-xs">
            {w.exEs && <a className="underline t-muted" href={`https://www.deepl.com/translator#es/vi/${encodeURIComponent(w.exEs)}`} target="_blank" rel="noopener noreferrer">Đối chiếu ES→VI bằng DeepL ↗</a>}
            {w.exVi && <a className="underline t-muted" href={`https://www.deepl.com/translator#vi/es/${encodeURIComponent(w.exVi)}`} target="_blank" rel="noopener noreferrer">Đối chiếu VI→ES bằng DeepL ↗</a>}
          </p></div>}
        {w.note && <div><p className="field-label">Ghi chú chuyên ngành</p><p className="text-sm">{w.note}</p></div>}
        <div>
          <p className="field-label">Họ từ — bấm một dạng từ để xem định nghĩa</p>
          <div className="flex flex-wrap gap-2">
            {forms.map(f => <button key={f} onClick={() => go(f)} aria-pressed={term === f} className={'chip ' + (term === f ? 'on' : '')}>{f}</button>)}
          </div>
          <div className="flex gap-2 mt-3">
            <input className="input" value={box} onChange={ev => setBox(ev.target.value)} onKeyDown={ev => ev.key === 'Enter' && go(box)} placeholder="Tra từ khác…" aria-label="Tra từ khác" />
            <button className="btn btn-secondary" onClick={() => go(box)}>Tra</button>
          </div>
        </div>
        <div className="rounded-xl p-4 text-sm" style={{ background: 'var(--surface2)' }}>
          <p className="field-label">Định nghĩa “{term}” · Wiktionary tiếng Tây Ban Nha</p>
          {st.loading ? <div className="space-y-2" aria-busy="true"><div className="skeleton h-4 w-3/4" /><div className="skeleton h-4 w-full" /><div className="skeleton h-4 w-2/3" /></div>
            : st.err ? <p className="t-muted">{st.err}</p> : <pre className="whitespace-pre-wrap font-[inherit] max-h-60 overflow-y-auto">{st.text}</pre>}
        </div>
        <div>
          <p className="field-label">Mở từ điển khác cho “{term}”</p>
          <div className="flex flex-wrap gap-2">{links.map(([l, u]) => <a key={l} href={u} target="_blank" rel="noopener noreferrer" className="btn btn-secondary !min-h-[34px] !py-1 !px-3 !text-xs">{l}<Icon n="ext" s={13} /></a>)}</div>
        </div>
        <div className="flex gap-2 justify-end"><button className="btn btn-secondary" onClick={onClose}>Đóng</button><button className="btn btn-primary" onClick={() => onEdit(w)}><Icon n="edit" s={16} />Sửa thuật ngữ</button></div>
      </div>
    </div>
  );
}

function Library({ words, onEdit, onDelete, onAdd, topics, q, setQ, topic, setTopic, emph, setEmph }) {
  const [open, setOpen] = useState(null);
  const [pos, setPos] = useState('');
  const list = useMemo(() => {
    const n = norm(q);
    return words.filter(w => (!topic || w.topic === topic) && (!pos || w.pos === pos) &&
      (!n || norm(w.es).includes(n) || norm(w.vi).includes(n) || w.family.some(f => norm(f).includes(n))));
  }, [words, q, topic, pos]);
  const openWord = open ? words.find(w => w.id === open) : null;
  const stop = fn => ev => { ev.stopPropagation(); fn(); };
  const stats = useMemo(() => [
    ['Thuật ngữ', words.length],
    ['Chủ đề đang dùng', new Set(words.map(w => w.topic).filter(Boolean)).size],
    ['Có câu ví dụ', words.filter(w => w.exEs || w.exVi).length],
    ['Dạng từ trong họ từ', words.reduce((a, w) => a + w.family.length, 0)]
  ], [words]);
  const filtered = q || topic || pos;
  return (
    <div className="space-y-5">
      <PageHead title="Thư viện thuật ngữ" text="Tra cứu, lọc và ôn lại kho thuật ngữ biên phiên dịch của bạn. Bấm vào một thẻ để xem chi tiết và tra từ điển." />
      {words.length > 0 && <div className="grid grid-cols-2 lg:grid-cols-4 gap-3">
        {stats.map(([l, v]) => <div key={l} className="card p-4"><p className="h-display text-3xl font-extrabold t-brand tabular-nums">{v}</p><p className="text-xs t-muted mt-1">{l}</p></div>)}</div>}
      <div className="card p-3 sm:p-4 space-y-3">
        <div className="relative">
          <span className="absolute left-3.5 top-1/2 -translate-y-1/2 t-muted pointer-events-none"><Icon n="search" /></span>
          <input className="input !pl-11 !min-h-[48px] !text-base" placeholder="Tìm nhanh tiếng Tây Ban Nha hoặc tiếng Việt (không cần dấu)…" aria-label="Tìm thuật ngữ" value={q} onChange={e => setQ(e.target.value)} />
        </div>
        <div className="flex flex-wrap gap-2 items-center">
          <select className="input !w-auto" aria-label="Lọc theo chủ đề" value={topic} onChange={e => setTopic(e.target.value)}><option value="">Mọi chủ đề</option>{topics.map(t => <option key={t}>{t}</option>)}</select>
          <select className="input !w-auto" aria-label="Lọc theo từ loại" value={pos} onChange={e => setPos(e.target.value)}><option value="">Mọi từ loại</option>{POS.map(t => <option key={t}>{t}</option>)}</select>
          {filtered && <button className="btn btn-ghost" onClick={() => { setQ(''); setTopic(''); setPos(''); }}>Xóa bộ lọc</button>}
          <div className="sm:ml-auto"><Seg label="Chọn ngôn ngữ nổi bật" value={emph} onChange={setEmph} options={[['vi', 'Nổi bật: Việt'], ['es', 'Nổi bật: Tây Ban Nha']]} /></div>
        </div>
      </div>
      <p className="text-xs t-muted">{list.length} / {words.length} thuật ngữ</p>
      {words.length === 0 ? <EmptyArt title="Thư viện còn trống" text="Thêm thuật ngữ đầu tiên, nhập file JSON hoặc đồng bộ từ vựng ở tab Cài đặt." action={<button className="btn btn-primary mt-2" onClick={onAdd}><Icon n="plus" s={16} />Thêm thuật ngữ</button>} />
        : list.length === 0 ? <EmptyArt title="Không có thuật ngữ phù hợp" text="Thử từ khóa khác hoặc bỏ bớt bộ lọc." action={<button className="btn btn-secondary mt-2" onClick={() => { setQ(''); setTopic(''); setPos(''); }}>Xóa bộ lọc</button>} />
        : <div className="grid gap-4 sm:grid-cols-2 xl:grid-cols-3">
          {list.map(w => {
            const big = emph === 'vi' ? w.vi : w.es, small = emph === 'vi' ? w.es : w.vi;
            return (
              <article key={w.id} role="button" tabIndex="0" onClick={() => setOpen(w.id)} onKeyDown={e => (e.key === 'Enter' || e.key === ' ') && (e.preventDefault(), setOpen(w.id))} className="card lift p-4 cursor-pointer flex flex-col gap-3">
                <div className="flex items-center justify-between gap-2"><span className="badge badge-gold">{w.topic}</span><span className="badge">{w.pos}</span></div>
                <div>
                  <h3 className={'h-display text-2xl leading-tight t-brand ' + (emph === 'es' ? 'font-bold' : 'font-medium')}>{big}</h3>
                  <p className={'mt-1 t-muted ' + (emph === 'es' ? 'font-medium' : 'font-semibold')}>{small}</p>
                </div>
                {w.family.length > 0 && <div className="flex flex-wrap gap-1.5">{w.family.slice(0, 4).map(f => <span key={f} className="chip !text-xs">{f}</span>)}{w.family.length > 4 && <span className="chip !text-xs">+{w.family.length - 4}</span>}</div>}
                {(w.exEs || w.exVi) && <div className="text-sm border-l-4 border-[#E9B000] pl-3"><p className="italic line-clamp-2">{w.exEs}</p><p className="t-muted line-clamp-2">{w.exVi}</p></div>}
                <div className="mt-auto pt-2 flex gap-1 border-t" style={{ borderColor: 'var(--border)' }}>
                  <button className="btn btn-ghost btn-icon" onClick={stop(() => speak(w.es))} aria-label="Nghe phát âm" title="Nghe phát âm"><Icon n="vol" /></button>
                  <button className="btn btn-ghost btn-icon" onClick={stop(() => onEdit(w))} aria-label="Sửa" title="Sửa"><Icon n="edit" /></button>
                  <button className="btn btn-ghost btn-icon" onClick={stop(() => confirm('Xóa thuật ngữ “' + w.es + '”?') && onDelete(w.id))} aria-label="Xóa" title="Xóa"><Icon n="trash" /></button>
                </div>
              </article>
            );
          })}
        </div>}
      {openWord && <Detail key={openWord.id} w={openWord} emph={emph} onClose={() => setOpen(null)} onEdit={onEdit} />}
    </div>
  );
}

function AddForm({ initial, onSave, onCancel, topics, settings }) {
  const [f, setF] = useState(initial || emptyForm);
  const [fam, setFam] = useState('');
  const [busy, setBusy] = useState(false);
  const [msg, setMsg] = useState('');
  const set = (k, v) => setF(p => ({ ...p, [k]: v }));
  const addFam = () => { const v = fam.trim(); if (v && !f.family.includes(v)) set('family', [...f.family, v]); setFam(''); };

  const analyze = async () => {
    if (!f.es.trim()) return setMsg('Hãy nhập từ/cụm từ tiếng Tây Ban Nha trước.');
    if (!settings.apiKey) return setMsg('Chưa có Gemini API Key. Vào tab “Cài đặt” để dán key.');
    setBusy(true); setMsg('');
    const prompt = `Bạn là chuyên gia biên phiên dịch Tây Ban Nha - Việt. Phân tích thuật ngữ tiếng Tây Ban Nha: "${f.es.trim()}"` +
      (f.topic ? ` (chủ đề: ${f.topic})` : '') +
      `. Trả về DUY NHẤT một JSON với các khóa: "vi" (nghĩa tiếng Việt ngắn gọn, chuẩn thuật ngữ), "pos" (một trong: ${POS.join(', ')}), ` +
      `"family" (mảng các từ cùng họ tiếng Tây Ban Nha, tối đa 6), "exEs" (một câu ví dụ tiếng Tây Ban Nha), "exVi" (bản dịch tiếng Việt của câu đó), "note" (ghi chú ngắn: collocation hoặc false friend nếu có, nếu không để rỗng).`;
    try {
      const url = `https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(settings.model)}:generateContent?key=${encodeURIComponent(settings.apiKey)}`;
      const opts = { method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }], generationConfig: { responseMimeType: 'application/json', temperature: 0.3 } }) };
      let r, j;
      for (let n = 1; n <= 3; n++) {
        r = await fetch(url, opts);
        j = await r.json().catch(() => ({}));
        if (r.ok || (r.status !== 503 && r.status !== 429) || n === 3) break;
        setMsg('Máy chủ Gemini đang bận, thử lại lần ' + (n + 1) + '/3…');
        await new Promise(res => setTimeout(res, 1500 * n));
      }
      if (!r.ok) throw new Error((j.error && j.error.message) || 'Lỗi ' + r.status + (r.status === 503 ? ' (máy chủ Gemini quá tải, thử lại sau hoặc đổi model trong Cài đặt)' : ''));
      const txt = j.candidates?.[0]?.content?.parts?.map(p => p.text).join('') || '';
      const d = JSON.parse(txt.replace(/```json|```/g, '').trim());
      setF(p => ({ ...p, vi: d.vi || p.vi, pos: POS.includes(d.pos) ? d.pos : p.pos,
        family: Array.isArray(d.family) ? [...new Set([...p.family, ...d.family.map(String)])] : p.family,
        exEs: d.exEs || p.exEs, exVi: d.exVi || p.exVi, note: d.note || p.note }));
      setMsg('Đã điền tự động. Hãy kiểm tra lại trước khi lưu.');
    } catch (e) { setMsg('Không phân tích được: ' + e.message); }
    setBusy(false);
  };

  const submit = () => {
    if (!f.es.trim() || !f.vi.trim()) return setMsg('Cần có cả từ tiếng Tây Ban Nha và nghĩa tiếng Việt.');
    onSave({ ...f, es: f.es.trim(), vi: f.vi.trim() });
    if (!initial) { setF(emptyForm); setMsg('Đã lưu.'); }
  };

  return (
    <div className="max-w-3xl mx-auto space-y-5">
      <PageHead title={initial ? 'Sửa thuật ngữ' : 'Thêm thuật ngữ'} text="Nhập thủ công hoặc để AI điền sẵn, rồi kiểm tra lại trước khi lưu." />
      <Section n="A" title="Thông tin cơ bản">
        <div className="grid sm:grid-cols-2 gap-4">
          <Field label="Từ / cụm từ tiếng Tây Ban Nha *"><input className="input !font-semibold" value={f.es} onChange={e => set('es', e.target.value)} placeholder="gobernar" /></Field>
          <Field label="Nghĩa tiếng Việt *"><input className="input !font-medium" value={f.vi} onChange={e => set('vi', e.target.value)} placeholder="cai trị, điều hành" /></Field>
          <Field label="Từ loại"><select className="input" value={f.pos} onChange={e => set('pos', e.target.value)}>{POS.map(p => <option key={p}>{p}</option>)}</select></Field>
          <Field label="Chủ đề (chọn hoặc gõ chủ đề mới)">
            <input className="input" list="topics" value={f.topic} onChange={e => set('topic', e.target.value)} />
            <datalist id="topics">{topics.map(t => <option key={t} value={t} />)}</datalist>
          </Field>
        </div>
      </Section>
      <section className="card ai-card p-5 flex flex-col sm:flex-row sm:items-center gap-4">
        <div className="flex-1"><h2 className="h-display text-base font-bold flex items-center gap-2"><Icon n="sparkles" />Phân tích bằng AI</h2>
          <p className="text-sm t-muted mt-1">Gemini điền nghĩa tiếng Việt, từ loại, họ từ, câu ví dụ song ngữ và ghi chú từ từ tiếng Tây Ban Nha bạn đã nhập.</p></div>
        <button className="btn btn-primary !min-h-[48px] !px-6" disabled={busy} onClick={analyze}>{busy ? <><span className="spin" />Đang phân tích…</> : <><Icon n="sparkles" s={16} />Phân tích bằng AI</>}</button>
      </section>
      <Section n="B" title="Họ từ">
        <div className="flex gap-2">
          <input className="input" aria-label="Thêm dạng từ" value={fam} onChange={e => setFam(e.target.value)} onKeyDown={e => e.key === 'Enter' && (e.preventDefault(), addFam())} placeholder="gobierno, gubernamental… (Enter để thêm)" />
          <button type="button" className="btn btn-secondary" onClick={addFam}><Icon n="plus" s={16} />Thêm</button>
        </div>
        {f.family.length > 0 ? <div className="flex flex-wrap gap-2">{f.family.map(x => <span key={x} className="chip">{x}<button type="button" className="ml-1 t-muted hover:text-[var(--err)]" aria-label={'Bỏ ' + x} onClick={() => set('family', f.family.filter(y => y !== x))}><Icon n="x" s={14} /></button></span>)}</div>
          : <p className="text-xs t-muted">Chưa có dạng từ nào.</p>}
      </Section>
      <Section n="C" title="Câu ví dụ">
        <div className="grid sm:grid-cols-2 gap-4">
          <Field label="Tiếng Tây Ban Nha"><textarea rows="3" className="input" value={f.exEs} onChange={e => set('exEs', e.target.value)} /></Field>
          <Field label="Bản dịch tiếng Việt"><textarea rows="3" className="input" value={f.exVi} onChange={e => set('exVi', e.target.value)} /></Field>
        </div>
      </Section>
      <Section n="D" title="Ghi chú chuyên ngành">
        <textarea rows="3" aria-label="Ghi chú chuyên ngành" className="input" value={f.note} onChange={e => set('note', e.target.value)} placeholder="Collocations, false friends, ngữ cảnh sử dụng…" />
      </Section>
      {msg && <Notice text={msg} />}
      <div className="card p-3 flex gap-2 justify-end sticky bottom-20 md:bottom-4 z-30">
        {onCancel && <button className="btn btn-secondary" onClick={onCancel}>Hủy</button>}
        <button className="btn btn-primary !px-6" onClick={submit}><Icon n="check" s={16} />Lưu thuật ngữ</button>
      </div>
    </div>
  );
}

const shuffle = a => { const b = [...a]; for (let i = b.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [b[i], b[j]] = [b[j], b[i]]; } return b; };

function TopicPick({ topics, topic, setTopic }) {
  return <select className="input !w-auto" aria-label="Lọc theo chủ đề" value={topic} onChange={e => setTopic(e.target.value)}>
    <option value="">Mọi chủ đề</option>{topics.map(t => <option key={t}>{t}</option>)}</select>;
}

function Cards({ words, topics }) {
  const [topic, setTopic] = useState('');
  const [dir, setDir] = useState('es-vi');
  const [i, setI] = useState(0);
  const [flip, setFlip] = useState(false);
  const [deck, setDeck] = useState([]);
  useEffect(() => { setDeck(words.filter(w => !topic || w.topic === topic)); setI(0); setFlip(false); }, [words, topic]);
  const w = deck[i];
  const go = d => { setFlip(false); setTimeout(() => setI(x => (x + d + deck.length) % deck.length), 120); };
  useEffect(() => {
    const h = e => {
      if (/INPUT|SELECT|TEXTAREA/.test(e.target.tagName) || !deck.length) return;
      if (e.key === 'ArrowRight') go(1); else if (e.key === 'ArrowLeft') go(-1);
    };
    window.addEventListener('keydown', h); return () => window.removeEventListener('keydown', h);
  });
  const esFirst = dir === 'es-vi';
  const pct = deck.length ? Math.round((i + 1) / deck.length * 100) : 0;
  return (
    <div className="max-w-2xl mx-auto space-y-5">
      <PageHead title="Flashcard" text="Lật thẻ để kiểm tra trí nhớ. Dùng phím ← → để chuyển thẻ, phím Enter hoặc Space để lật." />
      <div className="flex flex-wrap gap-2 items-center">
        <Seg label="Hướng dịch" value={dir} onChange={setDir} options={[['es-vi', 'Biên dịch ES → VI'], ['vi-es', 'Phiên dịch VI → ES']]} />
        <TopicPick topics={topics} topic={topic} setTopic={setTopic} />
      </div>
      {!w ? <EmptyArt title="Chưa có thẻ để học" text="Thêm thuật ngữ vào thư viện (hoặc chọn chủ đề khác) để bắt đầu luyện flashcard." /> : <>
        <div><div className="flex justify-between text-xs t-muted mb-2"><span>Thẻ {i + 1} / {deck.length}</span><span>{pct}%</span></div><div className="bar" role="progressbar" aria-valuenow={pct} aria-valuemin="0" aria-valuemax="100"><i style={{ width: pct + '%' }} /></div></div>
        <div className="flip cursor-pointer" onClick={() => setFlip(f => !f)} role="button" tabIndex="0" aria-label="Lật thẻ" onKeyDown={e => (e.key === ' ' || e.key === 'Enter') && (e.preventDefault(), setFlip(f => !f))}>
          <div className={'flip-inner h-80 ' + (flip ? 'on' : '')}>
            <div className="face card absolute inset-0 flex flex-col items-center justify-center p-6 text-center">
              <p className="text-xs tracking-widest uppercase t-muted">{esFirst ? 'Tiếng Tây Ban Nha' : 'Tiếng Việt'} · {w.topic}</p>
              <p className={'h-display text-4xl sm:text-5xl t-brand mt-5 ' + (esFirst ? 'font-bold' : 'font-medium')}>{esFirst ? w.es : w.vi}</p>

let audioCtx = null;
const getAudio = () => {
  try {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!audioCtx) audioCtx = new AC();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    return audioCtx;
  } catch (e) { return null; }
};
const tone = (freq, dur, type, vol, delay = 0) => {
  const c = getAudio(); if (!c) return;
  const t = c.currentTime + delay;
  const o = c.createOscillator(), g = c.createGain();
  o.type = type; o.frequency.value = freq;
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(c.destination);
  o.start(t); o.stop(t + dur + 0.02);
};
const tick = n => tone(n % 2 ? 1500 : 1100, 0.05, 'square', 0.06);
const bell = () => [0, 0.9].forEach(d => { tone(880, 1.4, 'sine', 0.25, d); tone(2430, 1.0, 'sine', 0.1, d); tone(4750, 0.6, 'sine', 0.05, d); });

const SESSION = 10;
function Drill({ words, topics, sound, setSound }) {
  const [topic, setTopic] = useState('');
  const [dir, setDir] = useState('es-vi');
  const [secs, setSecs] = useState(5);
  const [cur, setCur] = useState(null);
  const [left, setLeft] = useState(0);
  const [show, setShow] = useState(false);
  const [done, setDone] = useState(false);
  const [score, setScore] = useState({ ok: 0, no: 0 });
  const soundRef = useRef(sound);
  soundRef.current = sound;
  const pool = useMemo(() => words.filter(w => !topic || w.topic === topic), [words, topic]);
  const next = () => {
    if (!pool.length) return;
    getAudio();
    let w; do { w = pool[Math.floor(Math.random() * pool.length)]; } while (pool.length > 1 && cur && w.id === cur.id);
    setCur(w); setShow(false); setLeft(secs);
  };
  useEffect(() => {
    if (!cur || show) return;
    if (left <= 0) { setShow(true); if (soundRef.current) bell(); return; }
    const t = setTimeout(() => {
      const n = left - 1;
      setLeft(n);
      if (soundRef.current && n > 0) tick(n);
    }, 1000);
    return () => clearTimeout(t);
  }, [cur, show, left]);
  const answered = score.ok + score.no;
  const mark = ok => {
    const sc = ok ? { ...score, ok: score.ok + 1 } : { ...score, no: score.no + 1 };
    setScore(sc);
    if (sc.ok + sc.no >= SESSION) { setCur(null); setDone(true); } else next();
  };
  const restart = () => { setScore({ ok: 0, no: 0 }); setDone(false); setCur(null); };
  const prompt = cur && (dir === 'es-vi' ? cur.es : cur.vi);
  const answer = cur && (dir === 'es-vi' ? cur.vi : cur.es);
  const C = 2 * Math.PI * 52;
  return (
    <div className="max-w-2xl mx-auto space-y-5">
      <PageHead title="Luyện phản xạ" text={`Mỗi phiên gồm ${SESSION} thuật ngữ. Dịch nhẩm hoặc nói to trước khi hết giờ, rồi tự chấm.`} />
      <div className="card p-3 flex flex-wrap gap-2 items-center">
        <Seg label="Hướng dịch" value={dir} onChange={setDir} options={[['es-vi', 'ES → VI'], ['vi-es', 'VI → ES']]} />
        <Seg label="Thời gian" value={secs} onChange={setSecs} options={[[3, '3s'], [5, '5s'], [10, '10s']]} />
        <TopicPick topics={topics} topic={topic} setTopic={setTopic} />
        <button className={'btn btn-icon ml-auto ' + (sound ? 'btn-primary' : 'btn-secondary')} aria-pressed={sound} aria-label={sound ? 'Tắt âm thanh' : 'Bật âm thanh'} title={sound ? 'Âm thanh: bật' : 'Âm thanh: tắt'}
          onClick={() => { const v = !sound; setSound(v); if (v) { getAudio(); tick(1); } }}><Icon n={sound ? 'vol' : 'mute'} /></button>
      </div>
      {!pool.length ? <EmptyArt title="Chưa có thuật ngữ để luyện" text="Thêm thuật ngữ vào thư viện (hoặc chọn chủ đề khác) rồi quay lại luyện phản xạ." />
        : done ? (
          <div className="card p-8 text-center space-y-4">
            <p className="text-xs tracking-widest uppercase t-muted">Hoàn thành phiên luyện</p>
            <p className="h-display text-6xl font-extrabold t-brand">{Math.round(score.ok / SESSION * 100)}%</p>
            <p className="t-muted">Bạn nhớ {score.ok} / {SESSION} thuật ngữ{score.no > 0 ? `, ${score.no} thuật ngữ cần ôn lại.` : '.'}</p>
            <button className="btn btn-primary !px-6" onClick={restart}><Icon n="redo" s={16} />Luyện phiên mới</button>
          </div>
        ) : !cur ? (
          <div className="card p-10 text-center space-y-4">
            <p className="t-muted">Sẵn sàng chưa? Đồng hồ sẽ đếm ngược {secs} giây cho mỗi thuật ngữ.</p>
            <button className="btn btn-primary !min-h-[48px] !px-8" onClick={next}><Icon n="zap" s={16} />Bắt đầu luyện</button>
          </div>
        ) : (
          <div className="card p-5 sm:p-8 space-y-6">
            <div>
              <div className="flex justify-between text-xs t-muted mb-2"><span>Câu {answered + 1} / {SESSION}</span><span>Đã nhớ {score.ok} · Chưa nhớ {score.no}</span></div>
              <div className="bar" role="progressbar" aria-valuenow={answered} aria-valuemin="0" aria-valuemax={SESSION}><i style={{ width: (answered / SESSION * 100) + '%' }} /></div>
            </div>
            <div className="flex flex-col items-center gap-5 text-center">
              <div className="relative" style={{ width: 120, height: 120 }} aria-live="polite">
                <svg viewBox="0 0 120 120" width="120" height="120" style={{ transform: 'rotate(-90deg)' }} aria-hidden="true">
                  <circle cx="60" cy="60" r="52" fill="none" stroke="var(--surface2)" strokeWidth="9" />
                  <circle className="ring" cx="60" cy="60" r="52" fill="none" stroke={show ? 'var(--err)' : '#E9B000'} strokeWidth="9" strokeLinecap="round" strokeDasharray={C} strokeDashoffset={show ? C : C * (1 - left / secs)} />
                </svg>
                <div className="absolute inset-0 grid place-items-center h-display text-4xl font-extrabold tabular-nums t-brand">{show ? <Icon n="clock" s={34} /> : left}</div>
              </div>
              <p className={'h-display text-3xl sm:text-4xl t-brand ' + (dir === 'es-vi' ? 'font-bold' : 'font-medium')}>{prompt}</p>
              {show && <div className="w-full rounded-xl p-4" style={{ background: 'var(--surface2)' }}><p className="field-label">Đáp án</p><p className={'h-display text-3xl t-gold ' + (dir === 'es-vi' ? 'font-medium' : 'font-bold')}>{answer}</p></div>}
            </div>
            {show ? <div className="grid grid-cols-2 gap-3">
              <button className="btn btn-no !min-h-[56px] !text-base" onClick={() => mark(false)}><Icon n="x" />Chưa nhớ</button>
              <button className="btn btn-ok !min-h-[56px] !text-base" onClick={() => mark(true)}><Icon n="check" />Đã nhớ</button></div>
              : <button className="btn btn-primary w-full !min-h-[56px] !text-base" onClick={() => setShow(true)}>Hiện đáp án</button>}
          </div>
        )}
    </div>
  );
}

    if (!silent) setSyncMsg('');
    try {
      const base = new URL(settings.syncUrl || 'vocab.json', location.href).href;
      const r = await fetch(base + (base.includes('?') ? '&' : '?') + 't=' + Date.now(), { cache: 'no-store' });
      if (!r.ok) throw new Error('HTTP ' + r.status + (r.status === 404 ? ' (chưa có file vocab.json trên GitHub?)' : ''));
      const data = await r.json();
      const arr = Array.isArray(data) ? data : data.words;
      if (!Array.isArray(arr)) throw new Error('File phải là mảng JSON các thuật ngữ.');
      const res = mergeWords(wordsRef.current, arr, settings.overwrite, tombsRef.current);
      setWords(res.list);
      setSyncMsg(`Đồng bộ xong: thêm ${res.added}, cập nhật ${res.updated}, bỏ qua ${res.skipped}.`);
    } catch (e) { setSyncMsg('Không đồng bộ được: ' + e.message); }
    setSyncing(false);
  };

  const gistReady = !!(settings.gistToken.trim() && settings.gistId.trim());
  const gistSync = async (silent, auto) => {
    if (auto && !settings.gistAuto) return;
    if (!gistReady) { if (!silent) setGistMsg('Chưa nhập token và Gist ID.'); return; }
    if (gistBusyRef.current) return;
    gistBusyRef.current = true; setGistBusy(true);
    const tk = settings.gistToken.trim(), id = encodeURIComponent(settings.gistId.trim());
    try {
      const r = await gh('/gists/' + id, {}, tk);
      if (!r.ok) throw new Error(r.status === 401 ? 'Token sai hoặc đã hết hạn (401).' : r.status === 404 ? 'Không tìm thấy Gist (404): kiểm tra Gist ID và quyền gist của token.' : 'Lỗi ' + r.status);
      const g = await r.json();
      const f = g.files && g.files[GIST_FILE];
      let remote = { words: [], deleted: {} };
      if (f) {
        const text = f.truncated ? await (await fetch(f.raw_url)).text() : f.content;
        try { remote = JSON.parse(text); } catch (e) { throw new Error('File đồng bộ trong Gist bị hỏng.'); }
      }
      const local = { words: wordsRef.current, deleted: tombsRef.current };
      const merged = mergeState(local, remote);
      if (canon(merged) !== canon(local)) { setWords(merged.words); setTombs(merged.deleted); }
      let pushed = false;
      if (canon(merged) !== canon({ words: remote.words || [], deleted: remote.deleted || {} })) {
        const body = JSON.stringify({ files: { [GIST_FILE]: { content: JSON.stringify({ version: 1, savedAt: Date.now(), words: merged.words, deleted: merged.deleted }) } } });
        const pr = await gh('/gists/' + id, { method: 'PATCH', body }, tk);
        if (!pr.ok) throw new Error('Không ghi được lên Gist (' + pr.status + '). Token cần quyền gist.');
        pushed = true;
      }
      setGistMsg('Đã đồng bộ lúc ' + new Date().toLocaleTimeString('vi-VN') + (pushed ? ' · đã cập nhật Gist.' : '.'));
    } catch (e) { setGistMsg('Không đồng bộ được: ' + e.message); }
    gistBusyRef.current = false; setGistBusy(false);
  };
  gistSyncRef.current = gistSync;
  const gistCreate = async () => {
    const tk = settings.gistToken.trim();
    if (!tk) return setGistMsg('Hãy dán token trước.');
    setGistBusy(true);
    try {
      const content = JSON.stringify({ version: 1, savedAt: Date.now(), words: wordsRef.current, deleted: tombsRef.current });
      const r = await gh('/gists', { method: 'POST', body: JSON.stringify({ description: 'Glosario ES–VI – dữ liệu đồng bộ riêng tư', public: false, files: { [GIST_FILE]: { content } } }) }, tk);
      if (!r.ok) throw new Error(r.status === 401 ? 'Token sai hoặc đã hết hạn (401).' : r.status === 403 || r.status === 404 ? 'Token không đủ quyền tạo Gist (' + r.status + ').' : 'Lỗi ' + r.status);
      const g = await r.json();
      setSettings(c => ({ ...c, gistId: g.id }));
      setGistMsg('Đã tạo Gist riêng tư. Trên máy còn lại hãy nhập cùng token và Gist ID: ' + g.id);
    } catch (e) { setGistMsg('Không tạo được Gist: ' + e.message); }
    setGistBusy(false);
  };
  const applyState = remote => {
    const merged = mergeState({ words: wordsRef.current, deleted: tombsRef.current }, remote);
    setWords(merged.words); setTombs(merged.deleted);
    return merged;
  };
  const deleteWord = id => {
    const w = words.find(x => x.id === id);
    if (w) setTombs(t => ({ ...t, [keyOf(w)]: Date.now() }));
    setWords(words.filter(x => x.id !== id));
  };
  useEffect(() => {
    if (firstRun.current) { firstRun.current = false; return; }
    if (!settings.gistAuto || !gistReady) return;
    const t = setTimeout(() => gistSyncRef.current && gistSyncRef.current(true), 3000);
    return () => clearTimeout(t);
  }, [words, tombs]);
  useEffect(() => {
    const onVis = () => { if (document.visibilityState === 'visible' && gistSyncRef.current) gistSyncRef.current(true, true); };
    document.addEventListener('visibilitychange', onVis);
    return () => document.removeEventListener('visibilitychange', onVis);
  }, []);

  useEffect(() => {
    if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});
    const onPrompt = e => { e.preventDefault(); setInstallEvt(e); };
    window.addEventListener('beforeinstallprompt', onPrompt);
    window.addEventListener('appinstalled', () => setInstallEvt(null));
    if (settings.autoSync && location.protocol.startsWith('http')) syncNow(true);
    if (settings.gistAuto && gistReady && location.protocol.startsWith('http')) gistSync(true);
    return () => window.removeEventListener('beforeinstallprompt', onPrompt);
  }, []);
  const install = async () => { if (!installEvt) return; installEvt.prompt(); await installEvt.userChoice; setInstallEvt(null); };

  const saveWord = w => {
    const stamped = { ...w, updated: Date.now() };
    if (w.id) {
      const old = words.find(x => x.id === w.id);
      if (old && keyOf(old) !== keyOf(w)) setTombs(t => ({ ...t, [keyOf(old)]: Date.now() }));
      setWords(words.map(x => x.id === w.id ? stamped : x));
    } else {
      setTombs(t => { const n = { ...t }; delete n[keyOf(w)]; return n; });
      setWords([{ ...stamped, id: crypto.randomUUID(), created: Date.now() }, ...words]);
    }
    if (w.id) { setEditing(null); setTab('lib'); }
  };
  const tabs = [['lib', 'Thư viện', 'library'], ['add', 'Thêm từ', 'plus'], ['card', 'Flashcard', 'cards'], ['drill', 'Phản xạ', 'zap'], ['set', 'Cài đặt', 'settings']];
  const toast = gistMsg || syncMsg;
  useEffect(() => {
    if (!toast) return;
    const t = setTimeout(() => { setSyncMsg(''); setGistMsg(''); }, 6000);
    return () => clearTimeout(t);
  }, [toast]);
  const goTab = k => { setTab(k); if (k !== 'add') setEditing(null); window.scrollTo(0, 0); };
  const busyNow = syncing || gistBusy;

  return (
    <div className="min-h-screen">
      <header className="app-header sticky top-0 z-40">
        <div className="max-w-[1200px] mx-auto px-4 h-16 flex items-center gap-3">
          <button onClick={() => goTab('lib')} className="flex items-center gap-3 text-left" aria-label="Về Thư viện">
            <LogoMark s={38} />
            <span><span className="block h-display font-extrabold tracking-wide leading-none t-brand">GLOSARIO <span className="t-gold">ES–VI</span></span>
              <span className="hidden sm:block text-[11px] tracking-wider t-muted mt-1">Terminología · Traducción · Aprendizaje</span></span>
          </button>
          <nav className="hidden md:flex ml-6 gap-1" aria-label="Điều hướng chính">
            {tabs.map(([k, l, ic]) => <button key={k} onClick={() => goTab(k)} aria-current={tab === k ? 'page' : undefined} className={'nav-item ' + (tab === k ? 'on' : '')}><Icon n={ic} s={17} />{l}</button>)}
          </nav>
          <div className="ml-auto flex gap-2">
            <button className="btn btn-secondary btn-icon" disabled={busyNow} onClick={() => (gistReady ? gistSync(false) : syncNow(false))} aria-label="Đồng bộ từ vựng" title="Đồng bộ từ vựng">{busyNow ? <span className="spin" /> : <Icon n="sync" />}</button>
            <button className="btn btn-secondary btn-icon" onClick={() => setDark(!dark)} aria-label="Đổi giao diện sáng/tối" title={dark ? 'Chế độ sáng' : 'Chế độ tối'}><Icon n={dark ? 'sun' : 'moon'} /></button>
          </div>
        </div>
      </header>
      <main className="max-w-[1200px] mx-auto px-4 py-6 pb-28 md:pb-12">
        {tab === 'lib' && <Library words={words} topics={topics} q={q} setQ={setQ} topic={topic} setTopic={setTopic} emph={settings.emph} setEmph={v => setSettings(c => ({ ...c, emph: v }))}
          onAdd={() => setTab('add')} onEdit={w => { setEditing(w); setTab('add'); }} onDelete={deleteWord} />}
        {tab === 'add' && <AddForm key={editing ? editing.id : 'new'} initial={editing} topics={topics} settings={settings}
          onSave={saveWord} onCancel={editing ? () => { setEditing(null); setTab('lib'); } : null} />}
        {tab === 'card' && <Cards words={words} topics={topics} />}
        {tab === 'drill' && <Drill words={words} topics={topics} sound={settings.sound} setSound={v => setSettings(c => ({ ...c, sound: v }))} />}
        {tab === 'set' && <Settings settings={settings} setSettings={setSettings} words={words} setWords={setWords}
          tombs={tombs} applyState={applyState} onSync={syncNow} syncing={syncing} syncMsg={syncMsg} canInstall={!!installEvt} onInstall={install}
          gistSync={gistSync} gistCreate={gistCreate} gistBusy={gistBusy} gistMsg={gistMsg} />}
      </main>
      {toast && tab !== 'set' && <div className="toast" role="status"><span>{toast}</span><button onClick={() => { setSyncMsg(''); setGistMsg(''); }} aria-label="Đóng thông báo"><Icon n="x" s={16} /></button></div>}
      <nav className="md:hidden fixed bottom-0 inset-x-0 z-40 bottom-bar" aria-label="Điều hướng chính">
        <div className="grid grid-cols-5">
          {tabs.map(([k, l, ic]) => <button key={k} onClick={() => goTab(k)} aria-current={tab === k ? 'page' : undefined} className={'bb-item ' + (tab === k ? 'on' : '')}><Icon n={ic} s={21} />{l}</button>)}
        </div>
      </nav>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
